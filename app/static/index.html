<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Assistant</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #222;
    }
    h1 { font-size: 1.4rem; }
    #conversation {
      border: 1px solid #ccc;
      border-radius: 6px;
      min-height: 200px;
      padding: 0.75rem;
      margin-bottom: 1rem;
    }
    .message { margin: 0.5rem 0; white-space: pre-wrap; }
    .user { font-weight: bold; }
    .tools { font-size: 0.85rem; color: #666; }
    .request-id { font-size: 0.8rem; color: #666; font-family: monospace; }
    .error { color: #b00020; }
    form { display: flex; gap: 0.5rem; }
    input { flex: 1; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; }
    .key-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
    .key-row label { font-size: 0.9rem; }
    h2 { font-size: 1.15rem; margin-top: 2rem; }
    .notice { font-size: 0.85rem; color: #666; }
    #invoice-result { margin-top: 1rem; }
    table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; }
    th, td { border: 1px solid #ccc; padding: 0.3rem 0.5rem; text-align: left; }
    td.amount, th.amount { text-align: right; }
  </style>
</head>
<body>
  <h1>HR Assistant</h1>
  <div class="key-row">
    <label for="api-key">Clave de acceso</label>
    <input id="api-key" data-testid="api-key" type="password"
           placeholder="Tu clave de cliente" autocomplete="off">
  </div>
  <div id="conversation" data-testid="answer" aria-live="polite"></div>
  <form id="ask-form">
    <input id="question" data-testid="question" type="text"
           placeholder="Pregunta por un empleado (EMP-0001) o un departamento"
           autocomplete="off">
    <button id="send" data-testid="send" type="submit">Enviar</button>
  </form>

  <section aria-labelledby="invoice-title">
    <h2 id="invoice-title">Factura</h2>
    <p class="notice">Borrador sin validez fiscal: no se timbra ni se guarda.</p>
    <form id="invoice-form">
      <input id="invoice-text" data-testid="invoice-text" type="text"
             placeholder="Factura a Ferretería López 10 horas de consultoría fiscal"
             autocomplete="off">
      <button id="invoice-send" data-testid="invoice-send" type="submit">
        Crear borrador
      </button>
    </form>
    <div id="invoice-result" data-testid="invoice-result" aria-live="polite"></div>
  </section>
  <script>
    // El historial vive solo en el navegador; la API no guarda nada.
    const history = [];
    const conversation = document.getElementById("conversation");
    const form = document.getElementById("ask-form");
    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("send");
    const apiKeyInput = document.getElementById("api-key");

    // La clave vive solo en sessionStorage: se borra al cerrar la pestaña.
    // Nunca se guarda de forma permanente ni va escrita en esta página.
    const API_KEY_STORAGE = "hr-assistant-api-key";
    apiKeyInput.value = sessionStorage.getItem(API_KEY_STORAGE) || "";
    apiKeyInput.addEventListener("input", () => {
      sessionStorage.setItem(API_KEY_STORAGE, apiKeyInput.value.trim());
    });

    // Traduce un error HTTP a un mensaje en español para la persona.
    function errorReason(response) {
      if (response.status === 401) {
        return "Clave inválida";
      }
      if (response.status === 429) {
        const seconds = response.headers.get("Retry-After") || "unos";
        return "Demasiadas preguntas; espera " + seconds + " segundos";
      }
      if (response.status === 422) {
        return "La pregunta no es válida (vacía o demasiado larga).";
      }
      return "El servidor respondió con un error (" + response.status + ").";
    }

    // Agrega una línea a la conversación usando solo textContent.
    function addLine(text, className) {
      const line = document.createElement("div");
      line.className = "message " + className;
      line.textContent = text;
      conversation.appendChild(line);
      return line;
    }

    // Muestra el request_id para que la persona pueda citarlo a soporte.
    function showRequestId(requestId) {
      if (requestId) {
        const line = addLine("Id para soporte (request_id): " + requestId,
                             "request-id");
        line.setAttribute("data-testid", "request_id");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionInput.value.trim();
      if (!question) {
        addLine("Escribe una pregunta antes de enviar.", "error");
        return;
      }
      addLine("Tú: " + question, "user");
      sendButton.disabled = true;
      const apiKey = apiKeyInput.value.trim();
      sessionStorage.setItem(API_KEY_STORAGE, apiKey);
      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-API-Key": apiKey },
          body: JSON.stringify({ question: question, history: history }),
        });
        if (!response.ok) {
          addLine("Error: " + errorReason(response), "error");
          showRequestId(response.headers.get("X-Request-ID"));
          return;
        }
        const body = await response.json();
        addLine("Asistente: " + body.answer, "assistant");
        const tools = body.tools_used.length
          ? body.tools_used.join(", ")
          : "ninguna";
        addLine("Herramientas usadas: " + tools, "tools");
        showRequestId(body.request_id);
        history.push({ role: "user", content: question });
        history.push({ role: "assistant", content: body.answer });
        questionInput.value = "";
      } catch (error) {
        addLine("Error: no se pudo conectar con el servidor.", "error");
      } finally {
        sendButton.disabled = false;
        questionInput.focus();
      }
    });

    // Sección «Factura»: todo se pinta con textContent, nunca como HTML.
    const invoiceForm = document.getElementById("invoice-form");
    const invoiceInput = document.getElementById("invoice-text");
    const invoiceButton = document.getElementById("invoice-send");
    const invoiceResult = document.getElementById("invoice-result");

    // Crea un elemento con su texto ya escapado por textContent.
    function textElement(tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) {
        element.className = className;
      }
      return element;
    }

    // Muestra un mensaje de error en la sección de factura.
    function showInvoiceError(text) {
      invoiceResult.replaceChildren(textElement("div", "Error: " + text, "error"));
    }

    // Mensaje de error de /invoice: con 422 usa el detalle del servidor.
    async function invoiceErrorReason(response) {
      if (response.status === 422) {
        try {
          const body = await response.json();
          if (typeof body.detail === "string") {
            return body.detail;
          }
        } catch (error) {
          // Cuerpo ilegible: se usa el mensaje fijo.
        }
        return "La frase no es válida (vacía o demasiado larga).";
      }
      return errorReason(response);
    }

    // Arma la tabla de líneas de la factura.
    function invoiceTable(lines) {
      const table = document.createElement("table");
      const header = document.createElement("tr");
      const titles = ["Concepto", "Unidad", "Cantidad", "Precio", "Importe"];
      titles.forEach((title, index) => {
        header.appendChild(textElement("th", title, index >= 2 ? "amount" : ""));
      });
      table.appendChild(header);
      lines.forEach((line) => {
        const row = document.createElement("tr");
        row.appendChild(textElement("td", line.descripcion));
        row.appendChild(textElement("td", line.unidad));
        row.appendChild(textElement("td", String(line.cantidad), "amount"));
        row.appendChild(textElement("td", line.precio_unitario, "amount"));
        row.appendChild(textElement("td", line.importe, "amount"));
        table.appendChild(row);
      });
      return table;
    }

    // Pinta cliente, líneas, subtotal, IVA y total.
    function showInvoice(body) {
      const invoice = body.invoice;
      invoiceResult.replaceChildren(
        textElement("div", "Folio: " + invoice.folio + " (" + invoice.estado + ")"),
        textElement("div", "Fecha: " + invoice.fecha),
        textElement("div", "Cliente: " + invoice.cliente.nombre +
                           " (RFC " + invoice.cliente.rfc + ")"),
        invoiceTable(invoice.lineas),
        textElement("div", "Subtotal: " + invoice.subtotal + " " + invoice.moneda),
        textElement("div", "IVA (16 %): " + invoice.iva + " " + invoice.moneda),
        textElement("div", "Total: " + invoice.total + " " + invoice.moneda),
        textElement("div", "Id para soporte (request_id): " + body.request_id,
                    "request-id")
      );
    }

    invoiceForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = invoiceInput.value.trim();
      if (!text) {
        showInvoiceError("Escribe una frase antes de enviar.");
        return;
      }
      invoiceButton.disabled = true;
      const apiKey = apiKeyInput.value.trim();
      sessionStorage.setItem(API_KEY_STORAGE, apiKey);
      try {
        const response = await fetch("/invoice", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-API-Key": apiKey },
          body: JSON.stringify({ text: text }),
        });
        if (!response.ok) {
          showInvoiceError(await invoiceErrorReason(response));
          return;
        }
        showInvoice(await response.json());
      } catch (error) {
        showInvoiceError("no se pudo conectar con el servidor.");
      } finally {
        invoiceButton.disabled = false;
      }
    });
  </script>
</body>
</html>

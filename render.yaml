# Blueprint de Render para el HR Assistant (spec/04-production.md, punto 7).
# El servicio se llama igual que el repositorio para no pisar otro servicio de la cuenta.
services:
  - type: web
    name: hr-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Render publica solo cuando el pipeline de CI de GitHub pasa
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PROVIDER
        value: gateway
      - key: HIDE_INPUTS
        value: "true"
      - key: HIDE_OUTPUTS
        value: "true"
      # Secretos: Render los pide al crear el Blueprint; nunca se escriben aquí.
      # LANGSMITH_API_KEY es opcional y se agrega en Render > Environment si se
      # encienden las trazas.
      - key: API_KEYS
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
